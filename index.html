<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱调查问卷</title>
    <style>
        body {
            font-family: "Segoe UI", -apple-system, "Microsoft YaHei", sans-serif;
            background: #e3f2fd;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 80px;
        }
        h1 { text-align: center; color: #1565c0; }

        #homePage { text-align: center; margin-top: 60px; }
        #homePage p { font-size: 1.1em; color: #0d47a1; line-height: 1.8; margin-bottom: 30px; }

        .copyright-box {
            background: #ffffff;
            border: 1px dashed #1565c0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #0d47a1;
            font-size: 1em;
            line-height: 1.6;
        }
        .copyright-box a { color: #1976d2; font-weight: bold; text-decoration: none; }

        #startBtn {
            display: inline-block; padding: 15px 40px; background: #1976d2;
            color: white; border: none; border-radius: 50px; font-size: 20px;
            font-weight: bold; cursor: pointer; border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.4); transition: all 0.3s ease;
        }
        #startBtn:hover { background: #1565c0; transform: scale(1.05); }

        #quizPage { display: none; background: #ffffff; padding: 20px; border-radius: 12px; }
        #quizPage.show { display: block; animation: slideUpFade 0.5s ease forwards; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .question-box {
            min-height: 220px;
            padding: 15px;
            background: #f0f7ff;
            border-radius: 12px;
            border: 1px solid #bbdefb;
            margin-bottom: 20px;
        }
        .question-box .q-title { font-weight: bold; font-size: 1.1em; color: #0d47a1; margin-bottom: 15px; }
        .question-box .q-options { margin-top: 10px; }

        label {
            display: flex; align-items: center; margin: 12px 0; cursor: pointer;
            font-size: 1em; color: #333; transition: color 0.3s;
        }
        input[type="radio"] {
            appearance: none; -webkit-appearance: none; width: 22px; height: 22px;
            border: 2px solid #90caf9; border-radius: 50%; margin-right: 12px;
            position: relative; cursor: pointer; outline: none; transition: all 0.3s ease;
            background-color: #fff; flex-shrink: 0;
        }
        input[type="radio"]:hover { border-color: #1976d2; }
        input[type="radio"]:checked {
            border-color: #1565c0; background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15);
        }
        input[type="radio"]:checked::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 12px; height: 12px;
            border-radius: 50%; background-color: #1565c0; animation: popIn 0.2s ease-out forwards;
        }
        @keyframes popIn { from { transform: translate(-50%, -50%) scale(0); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        input[type="text"] {
            width: 90%; padding: 10px; font-size: 1em; border: 1px solid #90caf9;
            border-radius: 8px; margin-top: 10px; outline: none;
        }
        input[type="text"]:focus { border-color: #1976d2; box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1); }

        .no-answer-box {
            display: flex; align-items: center; margin-top: 10px; background: #e3f2fd;
            padding: 8px 15px; border-radius: 8px; border: 1px dashed #1976d2;
        }
        .no-answer-box input[type="checkbox"] {
            width: 20px; height: 20px; margin-right: 10px; cursor: pointer; accent-color: #1976d2;
        }
        .no-answer-box label { margin: 0; color: #0d47a1; font-weight: bold; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }
        .nav-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        #prevBtn {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #1565c0;
        }
        #prevBtn:hover { background: #bbdefb; }
        #prevBtn:disabled {
            background: #f5f5f5;
            color: #ccc;
            border-color: #ddd;
            cursor: not-allowed;
        }
        #nextBtn {
            background: #1976d2;
            color: white;
        }
        #nextBtn:hover { background: #1565c0; transform: scale(1.02); }

        #submitBtn {
            display: none;
            margin: 20px auto 0;
            padding: 14px 40px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        #submitBtn:hover { background: #1565c0; transform: scale(1.02); }

        #result {
            display: none; background: #e3f2fd; padding: 15px; border-radius: 10px;
            margin-top: 20px; white-space: pre-wrap; border: 1px dashed #1976d2;
            color: #0d47a1;
        }

        .footer-signature {
            position: fixed; bottom: 10px; right: 15px; font-size: 12px;
            color: #1565c0; background: rgba(255, 255, 255, 0.9);
            padding: 5px 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        #winDialogOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center;
        }
        #winDialogBox {
            width: 320px;
            background: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-family: "Segoe UI", sans-serif;
            border: 1px solid #ccc;
        }
        #winDialogBox .title-bar {
            background: #ffffff;
            padding: 8px 12px;
            font-size: 13px;
            color: #000;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e0e0e0;
        }
        #winDialogBox .title-bar .icon {
            margin-right: 5px;
        }
        #winDialogBox .content {
            padding: 25px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            color: #333;
        }
        #winDialogBox .warning-icon {
            width: 35px;
            height: 35px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        #winDialogBox .button-area {
            padding: 0 20px 20px;
            display: flex;
            justify-content: flex-end;
        }
        #winDialogBox button {
            background: #e1e1e1;
            border: 1px solid #adadad;
            padding: 6px 30px;
            font-size: 13px;
            border-radius: 3px;
            cursor: pointer;
            color: #333;
            font-family: "Segoe UI", sans-serif;
        }
        #winDialogBox button:hover {
            background: #e5f1fb;
            border-color: #0078d7;
        }
        #winDialogBox button:active {
            background: #cce4f7;
        }
    </style>
</head>
<body>

    <div id="homePage">
        <h1>恋爱调查问卷</h1>
        
        <div class="copyright-box">
            如有建议和bug请发送至邮件：<a href="mailto:3651247329@qq.com">3651247329@qq.com</a>
        </div>

        <p>
            此网站最终解释权归晓鱼所有<br>
            若要转发请发送邮件至：3651247329@qq.com
        </p>
        <button id="startBtn" onclick="startQuiz()">开始问答</button>
    </div>

    <div id="quizPage">
        <h1 style="margin-bottom: 20px;">开始答题</h1>

        <div id="questionContainer"></div>

        <div class="nav-buttons">
            <button id="prevBtn" class="nav-btn" onclick="prevQuestion()" disabled>上一题</button>
            <button id="nextBtn" class="nav-btn" onclick="nextQuestion()">下一题</button>
        </div>

        <button onclick="submitQuiz()" id="submitBtn">提交问卷</button>
        
        <div id="result"></div>
    </div>

    <div class="footer-signature">DeepSeek 制作人晓鱼</div>

    <div id="winDialogOverlay">
        <div id="winDialogBox">
            <div class="title-bar">
                <span><span class="icon">⚠️</span> 重命名</span>
                <span style="color:#888; font-weight:normal; cursor:pointer;" onclick="closeWarning()">✕</span>
            </div>
            <div class="content">
                <svg class="warning-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5.99L19.53 19H4.47L12 5.99ZM12 2L1 21H23L12 2ZM13 16H11V18H13V16ZM13 10H11V14H13V10Z" fill="#fbc02d"/>
                </svg>
                <div style="text-align: left;">有题目未答完整</div>
            </div>
            <div class="button-area">
                <button onclick="closeWarning()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // ====== 全局变量：保存所有题目的答案 ======
        const answers = {}; // 例如：{0: '让他滚', 5: '我写的内容', 6: '不说话'}
        const silentChecks = {}; // 记录特殊勾选
        const noProblemChecks = {}; // 记录特殊勾选

        const questions = [
            { type: 'radio', title: '1. 有异性找你搭话怎么办？', options: ['让他滚', '同意'] },
            { type: 'radio', title: '2. 你会出轨吗？', options: ['会', '不会'] },
            { type: 'radio', title: '3. 你喜欢现任还是前任？', options: ['现任', '前任', '都不喜欢'] },
            { type: 'radio', title: '4. 会介意对象的小脾气和敏感吗？', options: ['会', '不会', '要是敢我打死他（她）'] },
            { type: 'text', title: '5. 你认为你对象是什么样的人？（限制5-20字）', min: 5, max: 20 },
            { type: 'text', title: '6. 和对象吵架了你会怎么说？（5-100字）', min: 5, max: 100, hasSilent: true },
            { type: 'text', title: '7. 你最希望对象改正哪个问题？（1-10字）', min: 1, max: 10, hasNoProblem: true },
            { type: 'text', title: '8. 对象做什么事情时你会吃醋？（2-20字）', min: 2, max: 20 },
            { type: 'text', title: '9. 对象说什么你会难过？（2-15字）', min: 2, max: 15 },
            { type: 'text', title: '10. 你觉得两个人在一起最重要的是什么？（5-30字）', min: 5, max: 30 },
            { type: 'text', title: '11. 请给对象留下一句话（3-100字）', min: 3, max: 100 },
            { type: 'radio', title: '12. 以上是否是如实回答？', options: ['是', '有些不是', '不是'] }
        ];

        let currentIndex = 0;

        function closeWarning() {
            document.getElementById('winDialogOverlay').style.display = 'none';
            // 点击确定后：只需要把页面跳转到没填的题，但不清除答案
            if (typeof pendingIndex === 'number') {
                currentIndex = pendingIndex;
                renderQuestion();
                pendingIndex = null;
            }
        }

        let pendingIndex = null;

        function startQuiz() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('quizPage').classList.add('show');
            renderQuestion();
        }

        // ====== 核心：保存当前答案 ======
        function saveCurrentAnswer() {
            const q = questions[currentIndex];
            if (q.type === 'radio') {
                const selected = document.querySelector(`input[name="q${currentIndex}"]:checked`);
                answers[currentIndex] = selected ? selected.value : '';
            } else {
                const silentCheck = document.getElementById(`silentCheck${currentIndex}`);
                const noProblemCheck = document.getElementById(`noProblemCheck${currentIndex}`);
                const input = document.getElementById(`textAnswer${currentIndex}`);

                if (silentCheck && silentCheck.checked) {
                    answers[currentIndex] = '不说话';
                    silentChecks[currentIndex] = true;
                } else if (noProblemCheck && noProblemCheck.checked) {
                    answers[currentIndex] = '没有需要改正的问题';
                    noProblemChecks[currentIndex] = true;
                } else {
                    answers[currentIndex] = input ? input.value : '';
                    silentChecks[currentIndex] = false;
                    noProblemChecks[currentIndex] = false;
                }
            }
        }

        // ====== 核心：恢复当前答案 ======
        function restoreCurrentAnswer() {
            const q = questions[currentIndex];
            if (q.type === 'radio') {
                const savedVal = answers[currentIndex];
                if (savedVal) {
                    const radio = document.querySelector(`input[name="q${currentIndex}"][value="${savedVal}"]`);
                    if (radio) radio.checked = true;
                }
            } else {
                const input = document.getElementById(`textAnswer${currentIndex}`);
                const silentCheck = document.getElementById(`silentCheck${currentIndex}`);
                const noProblemCheck = document.getElementById(`noProblemCheck${currentIndex}`);

                // 恢复特殊勾选
                if (silentChecks[currentIndex]) {
                    silentCheck.checked = true;
                    input.disabled = true;
                } else if (noProblemChecks[currentIndex]) {
                    noProblemCheck.checked = true;
                    input.disabled = true;
                }

                // 恢复文本
                if (answers[currentIndex] && answers[currentIndex] !== '不说话' && answers[currentIndex] !== '没有需要改正的问题') {
                    input.value = answers[currentIndex];
                } else if (!silentChecks[currentIndex] && !noProblemChecks[currentIndex]) {
                    input.value = answers[currentIndex] || '';
                }
            }
        }

        // ====== 渲染 ======
        function renderQuestion() {
            const q = questions[currentIndex];
            const container = document.getElementById('questionContainer');
            let html = `<div class="question-box"><div class="q-title">${q.title}</div><div class="q-options">`;

            if (q.type === 'radio') {
                q.options.forEach(opt => {
                    html += `<label><input type="radio" name="q${currentIndex}" value="${opt}"> ${opt}</label>`;
                });
            } else {
                html += `<input type="text" id="textAnswer${currentIndex}" maxlength="${q.max}" placeholder="请输入${q.min}-${q.max}个字的描述...">`;
                html += `<div id="errorMsg${currentIndex}" class="error-msg" style="display:none; color:#d32f2f; background:#ffebee; border:1px solid #f44336; border-radius:5px; padding:8px; margin-top:8px; font-size:0.9em; font-weight:bold;"></div>`;
                
                if (q.hasSilent) {
                    html += `<div class="no-answer-box"><input type="checkbox" id="silentCheck${currentIndex}" onchange="toggleSilent(${currentIndex})"><label>不说话</label></div>`;
                }
                if (q.hasNoProblem) {
                    html += `<div class="no-answer-box"><input type="checkbox" id="noProblemCheck${currentIndex}" onchange="toggleNoProblem(${currentIndex})"><label>没有需要改正的问题</label></div>`;
                }
            }
            html += `</div></div>`;

            container.innerHTML = html;

            // 恢复之前填写的答案
            restoreCurrentAnswer();

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').style.display = currentIndex === questions.length - 1 ? 'none' : 'block';
            document.getElementById('submitBtn').style.display = currentIndex === questions.length - 1 ? 'block' : 'none';

            if (q.type === 'text') {
                const input = document.getElementById(`textAnswer${currentIndex}`);
                const errorMsg = document.getElementById(`errorMsg${currentIndex}`);
                
                input.addEventListener('input', function() {
                    if (this.value.length > q.max) {
                        this.value = this.value.substring(0, q.max);
                    }
                    let len = this.value.length;
                    if (len > 0 && len < q.min) {
                        errorMsg.textContent = `字数应多于${q.min}字`;
                        errorMsg.style.display = 'block';
                    } else {
                        errorMsg.style.display = 'none';
                    }
                });

                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    let pasteData = (e.clipboardData || window.clipboardData).getData('text');
                    let remaining = q.max - this.value.length;
                    if (remaining > 0) {
                        this.value = this.value + pasteData.substring(0, remaining);
                    }
                    this.dispatchEvent(new Event('input'));
                });
            }
        }

        // 翻页前保存当前答案
        function nextQuestion() {
            saveCurrentAnswer();
            currentIndex++;
            renderQuestion();
        }

        function prevQuestion() {
            saveCurrentAnswer();
            currentIndex--;
            renderQuestion();
        }

        function toggleSilent(index) {
            const input = document.getElementById(`textAnswer${index}`);
            const check = document.getElementById(`silentCheck${index}`);
            if (check.checked) {
                input.disabled = true;
                input.value = '';
            } else {
                input.disabled = false;
            }
        }

        function toggleNoProblem(index) {
            const input = document.getElementById(`textAnswer${index}`);
            const check = document.getElementById(`noProblemCheck${index}`);
            if (check.checked) {
                input.disabled = true;
                input.value = '';
            } else {
                input.disabled = false;
            }
        }

        function submitQuiz() {
            saveCurrentAnswer(); // 先保存当前题

            // 检查所有题目
            for (let i = 0; i < questions.length; i++) {
                const q = questions[i];
                let isComplete = true;
                const savedVal = answers[i];

                if (q.type === 'radio') {
                    isComplete = savedVal !== undefined && savedVal !== '';
                } else {
                    if (savedVal === '不说话' || savedVal === '没有需要改正的问题') {
                        isComplete = true;
                    } else {
                        isComplete = savedVal && savedVal.length >= q.min;
                    }
                }

                if (!isComplete) {
                    // 弹出警告并停留在未回答的题目
                    pendingIndex = i;
                    // 直接跳转（保存当前答案，切换到未答题）
                    currentIndex = i;
                    renderQuestion();
                    document.getElementById('winDialogOverlay').style.display = 'flex';
                    return;
                }
            }

            // 如果全部通过，生成最终答案
            let text = "恋爱调查问卷答案\n\n";
            questions.forEach((q, i) => {
                text += q.title + "\n";
                if (q.type === 'radio') {
                    text += (answers[i] || "（未选择）") + "\n\n";
                } else {
                    text += (answers[i] || "（未填写）") + "\n\n";
                }
            });
            text += "----------------------------------";

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = text;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('复制成功 请粘贴给你喜欢的人吧');
                }).catch(() => {
                    alert('请长按下方文字复制，然后发给我～');
                });
            } else {
                alert('请长按下方文字复制，然后发给我～');
            }
        }
    </script>
</body>
</html>
